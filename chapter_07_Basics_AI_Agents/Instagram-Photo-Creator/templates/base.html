<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}Instagram Photo Creator{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('index') }}">
      <span class="brand-mark">✦</span>
      <span class="brand-text">
        <strong>Instagram Photo Creator</strong>
        <small>{{ brand.handle if brand else '@meraki.by.ankita' }}</small>
      </span>
    </a>
    <nav class="topnav">
      <a href="{{ url_for('index') }}">Studio</a>
      <a href="{{ url_for('settings_get') }}">Settings</a>
    </nav>
  </header>
  <main class="wrap">
    {% block content %}{% endblock %}
  </main>
  <footer class="foot">
    <span>B.L.A.S.T. · A.N.T. 3-layer · 2160×3840 (9:16) · product pixels never regenerated</span>
  </footer>
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
